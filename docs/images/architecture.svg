<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">SlothPay architecture</title>
  <desc id="d">A browser talks to the Next.js dashboard, which forwards API calls to the FastAPI service. The API uses a pure state machine, an orchestration layer that calls the PayPal sandbox, PostgreSQL for payments and the audit trail, Redis for locks and live updates, an optional AI helper, and optional Temporal. PayPal sends signed webhooks back to the API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .core{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .store{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
      .ext{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
      .opt{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .l{font-size:11.5px;fill:#475569}
      .line{stroke:#475569;stroke-width:1.5;fill:none}
      .dash{stroke:#475569;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .bg{fill:#f8fafc}
    </style>
  </defs>
  <rect class="bg" width="960" height="600"/>

  <!-- Browser and dashboard -->
  <rect class="box" x="30" y="40" width="170" height="70" rx="10"/>
  <text class="h" x="115" y="70" text-anchor="middle">Browser</text>
  <text class="s" x="115" y="90" text-anchor="middle">buyer or judge</text>

  <rect class="box" x="30" y="170" width="170" height="110" rx="10"/>
  <text class="h" x="115" y="198" text-anchor="middle">Dashboard</text>
  <text class="s" x="115" y="218" text-anchor="middle">Next.js</text>
  <text class="s" x="115" y="236" text-anchor="middle">forwards /api to</text>
  <text class="s" x="115" y="252" text-anchor="middle">the API (same site,</text>
  <text class="s" x="115" y="268" text-anchor="middle">so the cookie works)</text>
  <path class="line" d="M115 110V170" marker-end="url(#a)"/>

  <!-- API -->
  <rect class="core" x="270" y="150" width="400" height="320" rx="12"/>
  <text class="h" x="470" y="178" text-anchor="middle">API (FastAPI)</text>
  <text class="l" x="470" y="196" text-anchor="middle">session cookie, rate limits, body cap, security headers</text>

  <rect class="box" x="290" y="212" width="170" height="72" rx="8"/>
  <text class="h" x="375" y="238" text-anchor="middle">Routes</text>
  <text class="s" x="375" y="256" text-anchor="middle">payments, passport,</text>
  <text class="s" x="375" y="272" text-anchor="middle">metrics, webhooks</text>

  <rect class="box" x="480" y="212" width="170" height="72" rx="8"/>
  <text class="h" x="565" y="238" text-anchor="middle">State machine</text>
  <text class="s" x="565" y="256" text-anchor="middle">pure rules: which move</text>
  <text class="s" x="565" y="272" text-anchor="middle">is allowed, and when</text>

  <rect class="box" x="290" y="300" width="360" height="72" rx="8"/>
  <text class="h" x="470" y="326" text-anchor="middle">Orchestration</text>
  <text class="s" x="470" y="344" text-anchor="middle">claim in the database first, then call PayPal with a stable id;</text>
  <text class="s" x="470" y="360" text-anchor="middle">an unknown outcome becomes UNCERTAIN and is checked later</text>

  <rect class="box" x="290" y="388" width="170" height="64" rx="8"/>
  <text class="h" x="375" y="414" text-anchor="middle">Workers</text>
  <text class="s" x="375" y="432" text-anchor="middle">recovery + webhook loops</text>
  <text class="s" x="375" y="446" text-anchor="middle">(own containers or in the API)</text>

  <rect class="opt" x="480" y="388" width="170" height="64" rx="8"/>
  <text class="h" x="565" y="414" text-anchor="middle">AI helper</text>
  <text class="s" x="565" y="432" text-anchor="middle">optional; explains only,</text>
  <text class="s" x="565" y="446" text-anchor="middle">never moves money</text>

  <path class="line" d="M200 225H270" marker-end="url(#a)"/>

  <!-- Stores -->
  <rect class="store" x="740" y="150" width="190" height="86" rx="10"/>
  <text class="h" x="835" y="178" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="835" y="198" text-anchor="middle">payments, attempts, events,</text>
  <text class="s" x="835" y="214" text-anchor="middle">append-only audit trail</text>

  <rect class="store" x="740" y="262" width="190" height="72" rx="10"/>
  <text class="h" x="835" y="290" text-anchor="middle">Redis</text>
  <text class="s" x="835" y="310" text-anchor="middle">duplicate lock, rate limits,</text>
  <text class="s" x="835" y="324" text-anchor="middle">live status updates</text>

  <rect class="opt" x="740" y="360" width="190" height="72" rx="10"/>
  <text class="h" x="835" y="388" text-anchor="middle">Temporal</text>
  <text class="s" x="835" y="408" text-anchor="middle">optional: ConditionalPay</text>
  <text class="s" x="835" y="422" text-anchor="middle">deadline timer (local only)</text>

  <path class="line" d="M670 200H740" marker-end="url(#a)"/>
  <path class="line" d="M670 298H740" marker-end="url(#a)"/>
  <path class="dash" d="M670 396H740" marker-end="url(#a)"/>

  <!-- PayPal -->
  <rect class="ext" x="270" y="520" width="400" height="60" rx="10"/>
  <text class="h" x="470" y="546" text-anchor="middle">PayPal sandbox</text>
  <text class="s" x="470" y="565" text-anchor="middle">orders, authorize, capture, void (no real money)</text>
  <path class="line" d="M400 472V520" marker-end="url(#a)"/>
  <path class="line" d="M540 520V472" marker-end="url(#a)"/>
  <text class="l" x="392" y="500" text-anchor="end">API calls</text>
  <text class="l" x="548" y="500">signed webhooks</text>

  <!-- Legend -->
  <rect class="box" x="30" y="430" width="14" height="14" rx="3"/>
  <text class="l" x="52" y="442">code in this repo</text>
  <rect class="opt" x="30" y="456" width="14" height="14" rx="3"/>
  <text class="l" x="52" y="468">optional</text>
  <rect class="store" x="30" y="482" width="14" height="14" rx="3"/>
  <text class="l" x="52" y="494">data store</text>
  <rect class="ext" x="30" y="508" width="14" height="14" rx="3"/>
  <text class="l" x="52" y="520">outside service</text>
</svg>